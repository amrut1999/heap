<!DOCTYPE html>

<head>
    <meta charset="UTF-8" />

    <title>Pro Sports Store</title>
    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: #0F0F0F;
            color: #E5E5E5;
        }
        
        header {
            background: #0A0A0A;
            color: white;
            padding: 16px;
            text-align: center;
            letter-spacing: 1px;
        }
        
        nav {
            background: #121212;
            border-bottom: 2px solid #1ED760;
        }
        
        nav a:hover {
            color: #1ED760;
        }
        
        nav a {
            color: white;
            text-decoration: none;
            cursor: pointer;
            font-weight: bold;
        }
        
        section {
            display: none;
            padding: 15px;
            max-width: 1200px;
            margin: auto;
        }
        
        .active {
            display: block;
        }
        
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin: 10px 0;
        }
        
        input,
        select {
            background: #0A0A0A;
            color: white;
            border: 1px solid #1ED760;
        }
        
        .products {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 14px;
        }
        
        .card {
            background: #121212;
            color: white;
            border: 1px solid #1ED76033;
        }
        
        .card:hover {
            border: 1px solid #1ED760;
            transform: translateY(-5px);
        }
        
        .card img {
            width: 100%;
            height: 120px;
            object-fit: cover;
            border-radius: 10px;
        }
        
        .price {
            color: #FFC107;
            font-size: 17px;
            font-weight: bold;
        }
    </style>
</head>

    <nav>
        <a onclick="openPage('home')">Home</a>

        function openPage(id) {
            document.querySelectorAll('section').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function show(data) {
            let h = '';
            data.forEach(p => {
                h += `<div class="card">
<img src="${p.img}"/>
<h4>${p.name}</h4>
<div class="price">₹${p.price}</div>
<div>${p.cat}</div>
</div>`;
            });
            document.getElementById('list').innerHTML = h;
        }

        function filter() {
            let s = document.getElementById('search').value.toLowerCase();
            let c = document.getElementById('sport').value;
            let f = products.filter(p => {
                return (p.name.toLowerCase().includes(s)) && (c === 'all' || p.cat === c);
            });
            show(f);
        }

        show(products);
