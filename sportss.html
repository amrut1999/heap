<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet">

    <title>SportZone</title>
    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: #0F0F0F;
            color: #E5E5E5;
        }
        
        header {
            background: #0A0A0A;
            color: white;
            padding: 16px;
            text-align: center;
            letter-spacing: 1px;
        }
        
        nav {
            display: flex;
            justify-content: center;
            gap: 18px;
            background: #121212;
            padding: 10px;
            border-bottom: 2px solid #1ED760;
        }
        
        nav a {
            color: white;
            text-decoration: none;
            cursor: pointer;
            font-weight: bold;
        }
        
        nav a:hover {
            color: #1ED760;
        }
        
        .container {
            max-width: 1200px;
            margin: auto;
            padding: 10px;
        }
        
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin: 10px 0;
        }
        
        input,
        select {
            background: #0A0A0A;
            color: white;
            border: 1px solid #1ED760;
            padding: 8px;
            border-radius: 8px;
        }
        
        .products {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-bottom: 25px;
        }
        
        @media(max-width:900px) {
            .products {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        
        @media(max-width:500px) {
            .products {
                grid-template-columns: 1fr;
            }
        }
        
        .card {
            background: #121212;
            color: white;
            border: 1px solid #1ED76033;
            padding: 10px;
            border-radius: 14px;
            transition: .3s;
        }
        
        .card:hover {
            border: 1px solid #1ED760;
            transform: translateY(-5px);
        }
        
        .card img {
            width: 100%;
            height: 120px;
            object-fit: cover;
            border-radius: 10px;
        }
        
        .price {
            color: #FFC107;
            font-size: 17px;
        }
        
        .section-title {
            margin: 10px 0;
            color: #1ED760;
        }
        
        .page {
            display: none;
        }
        
        .active {
            display: block;
        }
    </style>
</head>

<body>
    <header>
        <h2>SPRTTZone</h2>
    </header>

    <nav>
        <a onclick="openPage('home')">Home</a>
        <a onclick="openPage('cricketPage')">Cricket</a>
        <a onclick="openPage('footballPage')">Football</a>
        <a onclick="openPage('fitnessPage')">Fitness</a>
        <a onclick="openPage('cart')">Cart</a>

        <a onclick="openPage('all')">All Categories</a>
        <a onclick="openPage('contact')">Contact</a>
    </nav>

    <div class="container">

        <!-- HOME WITH SEARCH -->
        <div id="home" class="page active">

<option>Football</option>
<option>Badminton</option>
<option>Fitness</option>
<option>Basketball</option>
<option>Athletics</option>
</select>
            </div>
            <div class="products" id="result"></div>
        </div>

        <!-- CATEGORY PAGES -->
        <div id="cricketPage" class="page">
            <h3 class="section-title">Cricket Equipment</h3>
            <div id="cricket" class="products"></div>
        </div>

        <div id="footballPage" class="page">
            <h3 class="section-title">Football Equipment</h3>
            <div id="football" class="products"></div>
        </div>

        <div id="fitnessPage" class="page">
            <h3 class="section-title">Fitness Equipment</h3>
            <div id="fitness" class="products"></div>
        </div>

        <!-- ALL -->
        <div id="all" class="page">
            <h3 class="section-title">All Sports Collection</h3>
            <div id="allBox" class="products"></div>
        </div>

        <div id="contact" class="page">

        </div>

                name: 'Rope',
                price: 200,
                cat: 'Fitness',
                img: 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTAZg8ylDJ61ARzkpGZEAPE5IuO1lOJLCEyKw&s'

        ];


        function getCart() {
            return JSON.parse(localStorage.getItem('cart') || '[]');
        }

        function saveCart(c) {
            localStorage.setItem('cart', JSON.stringify(c));
        }


        function addToCart(name) {
            const item = products.find(p => p.name === name);
            const cart = getCart();
            cart.push(item);
            saveCart(cart);
            alert('Added to cart');
        }


        function removeFromCart(index) {
            const cart = getCart();
            cart.splice(index, 1);
            saveCart(cart);
            renderCart();
        }


        function renderCart() {
            const cart = getCart();
            let html = '';
            let total = 0;


            cart.forEach((p, i) => {
                total += p.price;
                html += `<div class='card'>
<h4>${p.name}</h4>
<div class='price'>₹${p.price}</div>
<button onclick="removeFromCart(${i})">Remove</button>
</div>`;
            });


            document.getElementById('cartBox').innerHTML = html || '<p>Cart empty</p>';
            document.getElementById('total').innerText = 'Total: ₹' + total;
        }

        function card(p) {
            return `<div class='card'>
<img src='${p.img}'/>
<h4>${p.name}</h4>
<div class='price'>₹${p.price}</div>
<div>${p.cat}</div>
</div>`;
        }

        function loadSections() {
            const cats = ['Cricket', 'Football', 'Fitness'];
            cats.forEach(c => {
                let box = document.getElementById(c.toLowerCase());
                box.innerHTML = products.filter(p => p.cat === c).map(card).join('');
            });
            document.getElementById('allBox').innerHTML = products.map(card).join('');
        }

        function liveSearch() {
            let s = search.value.toLowerCase();
            let c = sport.value;
            let f = products.filter(p =>
                p.name.toLowerCase().includes(s) && (c === 'all' || p.cat === c)
            );
            result.innerHTML = f.map(card).join('');
        }

        function openPage(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        loadSections();
        liveSearch();
    </script>
